<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Music Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: white;
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      color: #1db954;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 40px;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .song-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .song-card:hover {
      transform: scale(1.02);
    }

    .song-card iframe {
      width: 100%;
      height: 200px;
      border: none;
    }

    .song-info {
      padding: 15px;
    }

    .song-info h3 {
      font-size: 1.1em;
      margin-bottom: 5px;
    }

    .song-info p {
      color: #aaa;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <h1>🎵 My Music Site</h1>
  <p class="subtitle">My favourite songs</p>

  <div class="song-grid">

    <!-- SONG 1 - Replace the YouTube ID and details -->
    <div class="song-card">
      <iframe src="https://www.youtube.com/embed/ele2DMU49Jk" allowfullscreen></iframe>
      <div class="song-info">
        <h3>roses</h3>
        <p>Rick Astley</p>
      </div>
    </div>

    <!-- SONG 2 -->
    <div class="song-card">
      <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
      <div class="song-info">
        <h3>Song Title Here</h3>
        <p>Artist Name Here</p>
      </div>
    </div>

    <!-- SONG 3 -->
    <div class="song-card">
      <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
      <div class="song-info">
        <h3>Song Title Here</h3>
        <p>Artist Name Here</p>
      </div>
    </div>

  </div>

</body>
</html>
